<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ops! Algo deu errado - MeuCardápio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        * {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 50%, rgba(76, 175, 80, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(33, 150, 243, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .hero-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            color: white;
            text-align: center;
            padding: 2rem 0;
            position: relative;
            z-index: 1;
        }

        .hero-content {
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem;
        }

        .logo {
            font-size: 5rem;
            margin-bottom: 2rem;
            color: #ff6b6b;
            filter: drop-shadow(0 4px 15px rgba(255, 107, 107, 0.3));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .status-code {
            font-size: 5.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            letter-spacing: -2px;
            line-height: 1;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        p.mensagem {
            font-size: 1.1rem;
            font-weight: 300;
            margin-bottom: 3rem;
            opacity: 0.85;
        }

        p.caminho {
            font-size: 0.85rem;
            font-family: monospace;
            opacity: 0.5;
            margin-bottom: 3rem;
        }

        .btn-custom {
            display: inline-block;
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
            padding: 1.1rem 2.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            text-decoration: none;
        }

        .btn-custom:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(76, 175, 80, 0.4);
            background: linear-gradient(135deg, #45a049 0%, #3d8b40 100%);
            color: white;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-content > * {
            animation: fadeInUp 0.8s ease forwards;
            opacity: 0;
        }

        .hero-content .logo { animation-delay: 0.1s; }
        .hero-content .status-code { animation-delay: 0.25s; }
        .hero-content h1 { animation-delay: 0.4s; }
        .hero-content p.mensagem { animation-delay: 0.55s; }
        .hero-content p.caminho { animation-delay: 0.65s; }
        .hero-content .btn-custom { animation-delay: 0.8s; }

        @media (max-width: 576px) {
            .status-code { font-size: 3.5rem; }
            h1 { font-size: 1.4rem; }
            .logo { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <section class="hero-section">
        <div class="container">
            <div class="hero-content">
                <div class="logo">
                    <i class="bi bi-exclamation-triangle"></i>
                </div>
                <div class="status-code" th:text="${status}">404</div>
                <h1 th:text="${error}">Página não encontrada</h1>
                <p class="mensagem" th:text="${message != null and !#strings.isEmpty(message)} ? ${message} : 'Não conseguimos encontrar o que você procurava.'">
                    Não conseguimos encontrar o que você procurava.
                </p>
                <p class="caminho" th:if="${path != null}" th:text="${path}">/caminho</p>

                <a th:href="@{/}" class="btn-custom">
                    <i class="bi bi-house-door me-2"></i>Voltar ao Início
                </a>
            </div>
        </div>
    </section>
</body>
</html>
